<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phiếu đăng ký</title>
  </head>
  <body>
    <table border="2" width="760">
      <!-- tên -->
      <tr>
        <td colspan="3" align="center">
          <font size="6" color="red">Phiếu đăng ký</font>
        </td>
      </tr>
      <tr>
        <td bgcolor="yellow" width="360">Họ và Tên</td>
        <td bgcolor="yellow">
          <input type="text" size="30" />
        </td>
      </tr>
      <!-- dia chi -->
      <tr>
        <td bgcolor="yellow">Địa chỉ</td>
        <td bgcolor="yellow">
          <input type="text" size="30" />
        </td>
        <td bgcolor: yellow ></td>
      </tr>
      <!-- dien thoai -->
      <tr>
        <td bgcolor="yellow">Điện thoại</td>
        <td bgcolor="yellow">
          <input type="text" size="30" />
        </td>
      </tr>
      <tr>
        <td bgcolor="yellow">Phải</td>
        <td colspan="2" bgcolor="yellow">
          <input type="radio" name="gender" value="male" /> Nam
          <input type="radio" name="gender" value="female" /> Nữ
        </td>
      </tr>
      <!-- nghe nghiep -->
      <tr> 
        <td bgcolor="yellow">Nghề Nghiệp</td>
        <td colspan="2" bgcolor="yellow">
          <select>
            <option >Bác sĩ</option>
            <option >Giáo sư</option>
            <option >Kỹ sư</option>
            <option >Công nhân</option>
          </select>
      </tr>
      <tr>
        <td bgcolor="yellow">Chọn sản phẩm tham gia</td>
        <td bgcolor="yellow">
          <select>
            <option>Kem đánh răng</option>
            <option >Bàn chải đánh răng</option>
            <option >cạo lưỡi</option>
            <option >cốc</option>
          </select>
        </td>
      </tr>
      <tr>
        <td bgcolor="yellow">Số người dự đoán</td>
        <td bgcolor="yellow">
          <input type="text" size="30px">
        </td>
      </tr>
      <tr>
        <td bgcolor="yellow" colspan=2 align="center">
          <input type="submit" valueq="Đồng ý">
        </td>
      </tr>
    </table>
  </body>
</html>
