<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BT</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="anh">
      <img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQs0yHvuTK64Z1gxmWqniPyqpkHELihS5JrT08zwxU3_g&s=10"
      />
    </div>

    <div class="noi-dung">
      <div class="menu">
        <a href="#">Trang chủ</a>

        <a href="#">Giới thiệu sản phẩm</a>

        <a href="#">Các đại lý</a>

        <a href="#">Dịch vụ</a>

        <a href="#">Hợp tác</a>

        <a href="#">Góp ý</a>

        <a href="#">Quảng cáo</a>
      </div>

      <div class="hop-thu">
        <h2>HỘP THƯ GÓP Ý</h2>

        <form>
          <div class="dong">
            <label>Họ tên</label>
            <input type="text" />
          </div>

          <div class="dong">
            <label>Hộ khẩu</label>

            <select>
              <option>Tp Ho Chi Minh</option>
              <option>Đà Nẵng</option>
              <option>Hà Nội</option>
            </select>
          </div>

          <div class="dong">
            <label>Góp ý về lĩnh vực</label>

            <input type="checkbox" />
            <span>Dịch vụ</span>

            <input type="checkbox" />
            <span>Sản phẩm</span>

            <input type="checkbox" />
            <span>Loại khác</span>
          </div>

          <div class="dong">
            <label>Ngôn ngữ</label>

            <input type="radio" name="ngonngu" />
            <span>Anh</span>

            <input type="radio" name="ngonngu" />
            <span>Việt</span>
          </div>

          <div class="dong">
            <label>Nội dung</label>

            <textarea></textarea>
          </div>

          <div class="nut">
            <button type="submit">Gửi</button>

            <button type="reset">Xóa</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
